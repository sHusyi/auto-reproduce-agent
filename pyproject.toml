[project]
name = "auto-reproduce-agent"
version = "0.1.0"
description = "A structured research agent with Plan-Execute-Reflect-Replan loop for autonomous ML paper reproduction"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "pydantic>=2.0.0",
    "httpx>=0.27.0",
    "pandas>=2.0.0",
    "rich>=13.0.0",
    "python-dotenv>=1.0.0",
    "langsmith>=0.1.0",
    "pdfplumber>=0.11.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
mlagent = "chat:main"
mlagent-cli = "main:main"

[tool.setuptools.packages.find]
where = ["src"]
